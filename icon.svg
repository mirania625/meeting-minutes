<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <!-- Microphone Body Gradient -->
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Background (Rounded Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow -->
  <circle cx="256" cy="200" r="160" fill="#FFFFFF" opacity="0.08" />

  <!-- Main Microphone Group -->
  <g filter="url(#dropShadow)">
    <!-- Mic Capsule -->
    <rect x="208" y="128" width="96" height="160" rx="48" fill="url(#micGrad)" />

    <!-- Mic Mesh Line Accent -->
    <line x1="208" y1="208" x2="304" y2="208" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />

    <!-- Mic Cradle (U-Shape Bar) -->
    <path d="M168 224 C 168 312, 344 312, 344 224" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" />

    <!-- Mic Stem -->
    <line x1="256" y1="288" x2="256" y2="352" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" />

    <!-- Mic Base -->
    <line x1="192" y1="352" x2="320" y2="352" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" />
  </g>

  <!-- AI Sparkle 1 (Top Right) -->
  <path d="M 376 112 C 376 136, 396 156, 420 156 C 396 156, 376 176, 376 200 C 376 176, 356 156, 332 156 C 356 156, 376 136, 376 112 Z" fill="#FDE047" />

  <!-- AI Sparkle 2 (Small) -->
  <path d="M 140 100 C 140 112, 150 122, 162 122 C 150 122, 140 132, 140 144 C 140 132, 130 122, 118 122 C 130 122, 140 112, 140 100 Z" fill="#38BDF8" opacity="0.9" />

  <!-- AI Sparkle 3 (Bottom Left) -->
  <path d="M 360 360 C 360 370, 368 378, 378 378 C 368 378, 360 386, 360 396 C 360 386, 352 378, 342 378 C 352 378, 360 370, 360 360 Z" fill="#F472B6" opacity="0.8" />
</svg>
